schema_version: 1

context:
  name: langchain-nomic
  version: 1.1.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/langchain_nomic-${{ version }}.tar.gz
  sha256: 7919fb151bc16a1c271f2d398bb1ac3728241ace4996032c5c00457a85beaa62

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }},<4.0
    - langchain-core >=1.4.7,<2.0.0
    - nomic >=3.5.3
    - pillow >=12.1.1
tests:
  - python:
      imports:
        - langchain_nomic
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: An integration package connecting Nomic and LangChain
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/langchain-ai/langchain

extra:
  recipe-maintainers:
    - jan-janssen
